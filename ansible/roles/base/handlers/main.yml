---
# handlers file for roles/base
- name: Recargar sshd
  ansible.builtin.service:
    name: sshd
    state: reloaded
# No `systemctl reload`: en Rocky 9 hace `flush ruleset` y borra también las
# tablas de Docker. El archivo reemplaza solo la tabla apolo_training.
- name: Recargar nftables
  ansible.builtin.command: nft -f /etc/sysconfig/nftables.conf
  changed_when: true
- name: Reiniciar chronyd
  ansible.builtin.service:
    name: chronyd
    state: restarted
