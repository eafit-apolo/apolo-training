# tasks file for roles/base
- name: Usuarios
  ansible.builtin.import_tasks: usuarios.yml

- name: sshd
  ansible.builtin.import_tasks: sshd.yml

- name: Firewall
  ansible.builtin.import_tasks: firewall.yml

- name: SELinux
  ansible.builtin.import_tasks: selinux.yml

- name: Hora
  ansible.builtin.import_tasks: chrony.yml

# Al final: son las únicas tareas que descargan de Internet (requieren S4).
- name: Repositorios
  ansible.builtin.import_tasks: repositorios.yml

- name: Actualizaciones automáticas
  ansible.builtin.import_tasks: actualizaciones.yml

# Después de Repositorios: fail2ban está en EPEL.
- name: fail2ban
  ansible.builtin.import_tasks: fail2ban.yml
