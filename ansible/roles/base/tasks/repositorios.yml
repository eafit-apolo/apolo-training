# Orden: CRB primero (EPEL depende de él), luego EPEL. OpenHPC lo pone el rol
# slurm: solo hace falta donde corre Slurm.
- name: Repositorio CRB activo
  community.general.dnf_config_manager:
    name:
      - crb
    state: enabled

- name: Repositorio EPEL
  ansible.builtin.dnf:
    name: epel-release
    state: present
