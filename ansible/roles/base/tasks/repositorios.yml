# Orden: CRB primero (EPEL depende de él), luego EPEL (OpenHPC depende de él).
- name: Repositorio CRB activo
  community.general.dnf_config_manager:
    name:
      - crb
    state: enabled

- name: Repositorio EPEL
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Repositorio de OpenHPC 3
  ansible.builtin.dnf:
    name: http://repos.openhpc.community/OpenHPC/3/EL_9/x86_64/ohpc-release-3-1.el9.x86_64.rpm
    state: present
