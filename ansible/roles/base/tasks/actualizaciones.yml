- name: Paquete dnf-automatic
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

- name: Solo actualizaciones de seguridad, aplicadas
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.opcion }}"
    value: "{{ item.valor }}"
    mode: "0644"
  loop:
    - { opcion: upgrade_type, valor: security }
    - { opcion: apply_updates, valor: "yes" }
  loop_control:
    label: "{{ item.opcion }}"

- name: Timer de dnf-automatic
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    state: started
    enabled: true
