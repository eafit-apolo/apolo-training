- name: Paquete nftables
  ansible.builtin.dnf:
    name: nftables
    state: present

- name: Servicios instalados
  ansible.builtin.service_facts:

- name: firewalld detenido y enmascarado
  ansible.builtin.systemd_service:
    name: firewalld
    state: stopped
    enabled: false
    masked: true
  when: "'firewalld.service' in ansible_facts.services"

- name: Reglas de nftables
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/sysconfig/nftables.conf
    mode: "0600"
    validate: /usr/sbin/nft -c -f %s
  notify: Recargar nftables

- name: nftables activo
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true
