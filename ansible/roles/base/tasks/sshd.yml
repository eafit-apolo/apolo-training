- name: Quitar el permiso de root que deja el instalador
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/01-permitrootlogin.conf
    state: absent
  notify: Recargar sshd

# Antes de la configuración: sshd lo muestra antes de pedir la clave, también
# en la terminal de la plataforma (el gateway lo reenvía).
- name: Banner de sshd
  ansible.builtin.copy:
    content: "{{ base_banner }}"
    dest: /etc/issue.net
    mode: "0644"
  when: base_banner | length > 0

- name: Configuración de sshd
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/00-apolo-training.conf
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Recargar sshd
