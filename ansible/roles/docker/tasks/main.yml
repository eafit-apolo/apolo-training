---
# tasks file for roles/docker
- name: Verificar que hay al menos un administrador
  ansible.builtin.assert:
    that: docker_admins | length > 0
    fail_msg: docker_admins está vacío; sin admin nadie puede usar docker sin sudo.

- name: Paquetes
  ansible.builtin.import_tasks: paquetes.yml

# Antes de arrancar docker: la primera vez ya arranca con esta configuración.
- name: daemon.json
  ansible.builtin.import_tasks: daemon.yml

- name: Servicio y grupo
  ansible.builtin.import_tasks: servicio.yml

- name: DOCKER-USER
  ansible.builtin.import_tasks: firewall.yml

- name: Directorios
  ansible.builtin.import_tasks: directorios.yml

- name: Proyecto de prueba
  ansible.builtin.import_tasks: prueba.yml

- name: Secretos de Compose
  ansible.builtin.import_tasks: secretos.yml

- name: known_hosts del gateway de terminal
  ansible.builtin.import_tasks: terminal.yml
