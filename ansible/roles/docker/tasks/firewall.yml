- name: Script de reglas de DOCKER-USER
  ansible.builtin.template:
    src: docker-user.sh.j2
    dest: /usr/local/sbin/docker-user
    mode: "0750"
  notify: Aplicar reglas de DOCKER-USER

- name: Unidad que aplica las reglas después de docker
  ansible.builtin.template:
    src: docker-user.service.j2
    dest: /etc/systemd/system/docker-user.service
    mode: "0644"
  notify: Aplicar reglas de DOCKER-USER

- name: Unidad de DOCKER-USER activa
  ansible.builtin.systemd_service:
    name: docker-user.service
    state: started
    enabled: true
    daemon_reload: true
