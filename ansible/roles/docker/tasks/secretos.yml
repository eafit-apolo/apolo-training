# Los valores vienen del Vault. no_log: ni el contenido ni el diff salen en
# pantalla. Cambiar un secreto no reinicia nada: los contenedores los leen al
# crearse (eso lo hace el despliegue, W-06).
- name: Secretos de Compose
  ansible.builtin.copy:
    content: "{{ item.contenido }}\n"
    dest: "{{ docker_raiz }}/secrets/{{ item.nombre }}"
    owner: "{{ item.dueno }}"
    group: "{{ item.dueno }}"
    mode: "{{ item.modo }}"
  loop: "{{ docker_secretos }}"
  loop_control:
    label: "{{ item.nombre }}"
  no_log: true
