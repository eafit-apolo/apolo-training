---
# handlers file for roles/slurm
# Se ejecutan en este orden (el del archivo), no en el que se notifican.
- name: Reiniciar munge
  ansible.builtin.service:
    name: munge
    state: restarted

- name: Reiniciar mariadb
  ansible.builtin.service:
    name: mariadb
    state: restarted

- name: Reiniciar slurmdbd
  ansible.builtin.service:
    name: slurmdbd
    state: restarted

- name: Reiniciar slurmctld
  ansible.builtin.service:
    name: slurmctld
    state: restarted

- name: Reiniciar slurmd
  ansible.builtin.service:
    name: slurmd
    state: restarted
