# Depende de EPEL, que pone base. La llave de OpenHPC viene dentro de este
# mismo paquete, así que su firma no se puede verificar antes de instalarlo;
# los paquetes del repositorio sí se verifican, con la llave que deja.
- name: Repositorio de OpenHPC 3
  ansible.builtin.dnf:
    name: http://repos.openhpc.community/OpenHPC/3/EL_9/x86_64/ohpc-release-3-1.el9.x86_64.rpm
    state: present
    disable_gpg_check: true

- name: Paquetes de Slurm, munge y MariaDB
  ansible.builtin.dnf:
    name:
      - ohpc-slurm-server # slurmctld, munge y las plantillas de OpenHPC
      - slurm-slurmd-ohpc # slurmd: este mismo nodo también calcula
      - slurm-slurmdbd-ohpc # slurmdbd: contabilidad
      - mariadb-server
      - python3-PyMySQL # lo necesita community.mysql dentro de la VM
    state: present
