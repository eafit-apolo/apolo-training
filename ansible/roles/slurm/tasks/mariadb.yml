- name: Configuración de MariaDB para Slurm
  ansible.builtin.template:
    src: mariadb-slurm.cnf.j2
    dest: /etc/my.cnf.d/slurm.cnf
    mode: "0644"
  notify: Reiniciar mariadb

- name: MariaDB activo
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Base de datos de contabilidad
  community.mysql.mysql_db:
    name: slurm_acct_db
    state: present
    login_unix_socket: /var/lib/mysql/mysql.sock

- name: Usuario slurm de MariaDB
  community.mysql.mysql_user:
    name: slurm
    host: localhost
    password: "{{ slurm_bd_password }}"
    priv: "slurm_acct_db.*:ALL"
    state: present
    login_unix_socket: /var/lib/mysql/mysql.sock
  no_log: true
