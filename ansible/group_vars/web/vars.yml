# Plataforma (117): base + docker.

# F1: SSH y ping solo desde la VPN; el resto se rechaza (F2). El 443 no va
# aquí: los puertos publicados por Docker no pasan por entrada (ver DOCKER-USER).
base_ssh_permitido:
  - "{{ vault_red_vpn }}"

# Mismos destinos prohibidos que la VM de práctica (F3, F4 y F5)
base_salida_bloqueada:
  - "{{ vault_ip_freeipa_apolo2 }}"
  - "{{ vault_ip_freeipa_apolo3 }}"
  - "{{ vault_ip_hipervisor }}"
  - "{{ vault_red_servicios }}"

# S4: salida web (80/443) hasta esta fecha, para la instalación inicial.
base_internet_hasta: "2026-11-27"

# S5: el 443 queda abierto sin fecha. certbot renueva el certificado cada
# ~60 días, Docker baja las imágenes de GHCR en cada despliegue y dnf usa
# repositorios https. El perimetral tiene la misma regla (S5, permanente).
base_salida_https_permanente: true

# Docker filtra el reenvío (ver roles/docker).
base_reenvio_politica: accept

docker_admins: "{{ vault_admins }}"
docker_443_permitido:
  - "{{ vault_red_vpn }}"
docker_salida_bloqueada: "{{ base_salida_bloqueada }}"
# El proxy real (W-05) publica el 80 y el 443: el proyecto de prueba sobra y
# chocaría con él.
docker_prueba: absent
# Secretos de Compose en /srv/apolo-training/secrets. La API corre como el uid
# 10001 y Compose monta los archivos tal cual: por eso son suyos y de solo
# lectura. db_password lo lee postgres al crear la base (arranca como root).
docker_secretos:
  - nombre: db_password
    contenido: "{{ vault_db_password }}"
    dueno: root
    modo: "0600"
  - nombre: api_database_url
    # La clave es hex: va tal cual en la URL, sin escapar nada.
    contenido: "postgresql+asyncpg://training:{{ vault_db_password }}@db:5432/training"
    dueno: "10001"
    modo: "0400"
  - nombre: api_secreto
    contenido: "{{ vault_api_secreto }}"
    dueno: "10001"
    modo: "0400"

ansible_python_interpreter: /usr/bin/python3

# La de group_vars/all es la del admin de la 116.
ansible_become_password: "{{ ansible_become_password_web }}"

# Llave ED25519 de la VM de práctica para el gateway de terminal. Huella
# revisada a mano el 2026-11-11 contra la que muestra la propia 116
# (ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub):
#   SHA256:+/Ssb7VPPF5ELXWWnY4V4n5bWSZm6ylTHx7FcbFOrlU
# El nombre tiene que ser el mismo de TERMINAL_SSH_HOST (deploy/compose.yaml).
docker_known_hosts: >-
  apolo-training.apolo.eafit.edu.co ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP70FiQkjLEwqF1c+Pdiwn/IowfbHTkAjLEqUtnWDUwY

# Certificado de Let's Encrypt (rol certbot). El dominio es el server_name de
# deploy/nginx.conf; el correo, el de la cuenta de la CA (en el Vault).
certbot_dominio: training.apolo.eafit.edu.co
certbot_correo: "{{ vault_certbot_correo }}"
