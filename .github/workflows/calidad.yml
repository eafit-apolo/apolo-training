# CI (V-02): pre-commit, gitleaks y las pruebas del verificador, de la API y de
# la web en cada PR.
# Todos los jobs son (o serán) checks obligatorios de main, así que no llevan
# filtros de rutas: un check obligatorio que no corre deja el PR bloqueado.
name: Calidad

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Correr los hooks en todo el repo
        # gitleaks va en su propio job: su hook revisa solo lo que está en
        # staged, y en CI no hay nada en staged, así que pasaría sin revisar.
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.0" # la misma del .pre-commit-config.yaml
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (verificando su checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sumas="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/$sumas"
          sha256sum --check --ignore-missing "$sumas"
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Revisar los commits del PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --config .gitleaks.toml --log-opts="$BASE..$HEAD" --redact --verbose .

      - name: Revisar todo el historial (ejecución manual)
        if: github.event_name == 'workflow_dispatch'
        run: gitleaks git --config .gitleaks.toml --redact --verbose .

  verificador-py312:
    name: verificador (3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar las dependencias de prueba
        run: python -m pip install -r verifier/requirements-dev.txt

      - name: Correr pytest
        run: python -m pytest verifier

  verificador-py36:
    name: verificador (3.6)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # setup-python ya no ofrece 3.6 en ubuntu-24.04, así que se usa la imagen
    # oficial. La etiqueta no cambia: 3.6 dejó de recibir versiones en 2021.
    container: python:3.6-slim-bullseye
    steps:
      - uses: actions/checkout@v5

      - name: Instalar las dependencias de prueba
        run: python -m pip install -r verifier/requirements-dev.txt

      - name: Correr pytest
        run: python -m pytest verifier

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # ruff de api/ ya lo corre el job pre-commit (con api/ruff.toml); aquí van
    # las migraciones y las pruebas contra un PostgreSQL 16 de verdad.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apolo
          POSTGRES_PASSWORD: apolo # base efímera del job, solo para pruebas
          POSTGRES_DB: apolo_training
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apolo -d apolo_training"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_DATABASE_URL: postgresql+asyncpg://apolo:apolo@localhost:5432/apolo_training
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Instalar las dependencias de prueba
        run: python -m pip install -r requirements-dev.txt

      - name: Aplicar las migraciones
        run: alembic upgrade head

      - name: Deshacer las migraciones y volver a aplicarlas
        # Toda migración debe poder deshacerse (DoD de la B-02).
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Comprobar que los modelos y las migraciones coinciden
        run: alembic check

      - name: Correr pytest
        run: python -m pytest

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # prettier de web/ ya lo corre el job pre-commit (con web/.prettierrc.json);
    # aquí van ESLint, las pruebas y el build de producción.
    env:
      NG_CLI_ANALYTICS: "false"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar las dependencias
        run: npm ci

      - name: ESLint
        run: npx ng lint

      - name: Pruebas
        run: npx ng test --watch=false

      - name: Build de producción sin advertencias
        # ng build no falla por una advertencia (presupuesto, CSS, imports),
        # así que se busca en la salida.
        run: |
          set -o pipefail
          npx ng build 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -q "WARNING" "$RUNNER_TEMP/build.log"; then
            echo "::error::ng build dejó advertencias"
            exit 1
          fi
