# Solo para desarrollar y probar la API en tu equipo (B-01). El entorno
# completo (web, api y db con datos de ejemplo) llega con la Q-02 en
# deploy/compose.dev.yaml. La clave es local y de prueba: no se usa en la 117.
#
#   docker compose up -d db          # solo la base, para correr pytest
#   docker compose up -d --build     # base + API en http://localhost:8000
name: apolo-training-api

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: apolo
      POSTGRES_PASSWORD: apolo
      POSTGRES_DB: apolo_training
    ports:
      - "127.0.0.1:${API_DB_PUERTO:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apolo -d apolo_training"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: local
    environment:
      API_DATABASE_URL: postgresql+asyncpg://apolo:apolo@db:5432/apolo_training
      API_DOCS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
