# La plataforma en la 117. Hoy la base (W-05) y la terminal (T-05); la API, la
# web y el proxy llegan con la W-06. En la 117 vive en /srv/apolo-training y se
# corre desde ahí; ver «La plataforma en la 117» en deploy/README.md.
#
#   docker compose up -d
#   docker compose exec db psql -U training -c 'select 1'
#
# Los datos y la clave están fuera del repo, en APOLO_TRAINING_RAIZ
# (/srv/apolo-training por defecto; el rol docker de Ansible crea las carpetas).
name: apolo-training

services:
  proxy:
    # Único punto de entrada: TLS, la web y el paso a la API y a la terminal.
    # Versión fijada, como en db; revisa en Docker Hub la estable vigente.
    image: nginx:1.28-alpine
    ports:
      - "80:80" # solo el reto de Let's Encrypt; lo demás da 404
      - "443:443" # la plataforma; el perimetral lo deja solo a la VPN
    volumes:
      # Va en conf.d: la imagen ya trae events y http, y lo incluye ahí.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      # Retos que escribe certbot en el host.
      - ${APOLO_TRAINING_RAIZ:-/srv/apolo-training}/acme:/var/www/acme:ro,Z
      # Certificado y llave (600, root) que deja el script de certbot.
      - ${APOLO_TRAINING_RAIZ:-/srv/apolo-training}/tls:/etc/nginx/tls:ro,Z
    networks:
      - interna # la API y la terminal
      - frontal # publicar el 80 y el 443
    # Solo escribe su caché y el pid, en memoria.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
    cap_drop: [ALL]
    # Lo mínimo para que el proceso principal arranque como root y pase los
    # workers al usuario nginx.
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  db:
    # Versión menor fijada; Debian y no Alpine porque su usuario postgres es el
    # uid 999, el dueño de pgdata en el rol docker.
    image: postgres:16.15-trixie
    environment:
      POSTGRES_USER: training
      POSTGRES_DB: training
      # La imagen lee la clave de este archivo; solo se usa al crear la base
      # (con pgdata vacío).
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      # :Z porque la carpeta es solo de este contenedor (SELinux).
      - ${APOLO_TRAINING_RAIZ:-/srv/apolo-training}/pgdata:/var/lib/postgresql/data:Z
    # Sin ports: solo se llega desde la red interna del compose.
    networks:
      - interna
    healthcheck:
      # Por TCP a propósito: mientras se inicializa, PostgreSQL solo escucha en
      # el socket, así que el chequeo no da «listo» antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U training -d training"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # Tiempo para cerrar limpio al apagar la VM, antes de que Docker lo mate.
    stop_grace_period: 1m

  terminal:
    # Imagen de terminal/Dockerfile que publica la CI (Imágenes). La W-06
    # alinea las etiquetas con las de la API y la web.
    image: ${IMAGE_PREFIX:-ghcr.io/eafit-apolo}/apolo-training-terminal:${TERMINAL_TAG:-main}
    environment:
      TERMINAL_ORIGEN: https://training.apolo.eafit.edu.co
      TERMINAL_API_URL: http://api:8000
      # Si el nombre aún no resuelve, la IP va en el .env de la 117, nunca en
      # el repo (y known_hosts debe usar ese mismo nombre o IP).
      TERMINAL_SSH_HOST: ${TERMINAL_SSH_HOST:-apolo-training.apolo.eafit.edu.co}
    volumes:
      # Llave pública de la VM de práctica, con la huella revisada a mano (ver
      # terminal/README.md). :Z porque es solo de este contenedor.
      - ${APOLO_TRAINING_RAIZ:-/srv/apolo-training}/terminal/known_hosts:/run/terminal/known_hosts:ro,Z
    # Sin ports: nginx (W-06) le llega por la red interna.
    networks:
      - interna # la API
      - salida # el 22 de la VM de práctica
    # No escribe en disco ni necesita privilegios.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  # internal: sin salida a internet ni a la red de la 117.
  interna:
    internal: true
  # La red de salida de terminal, para el SSH a la VM de práctica.
  # DOCKER-USER (rol docker) le bloquea lo mismo que a la VM.
  salida: {}
  # Solo para publicar el 80 y el 443 del proxy. Docker no publica puertos de
  # un contenedor que solo está en una red internal.
  frontal: {}

secrets:
  db_password:
    # Una línea con la clave; dueño root, modo 600. Nunca en el repo.
    file: ${APOLO_TRAINING_RAIZ:-/srv/apolo-training}/secrets/db_password
