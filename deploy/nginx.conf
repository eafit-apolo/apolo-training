resolver 127.0.0.11 valid=10s;

upstream web_upstream {
    zone web_upstream 64k;
    server web:8080 resolve;
}
upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream terminal_upstream {
    zone terminal_upstream 64k;
    server terminal:8001 resolve;
}

#Puerto 80: abierto a Internet solo para que Let's Encrypt valide el dominio.
server {
    listen 80;
    server_name training.apolo.eafit.edu.co;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Todo lo demás da 404; el 80 no expone la plataforma.
    location / {
        return 404;
    }
}

# Puerto 443: la plataforma, solo desde la VPN (lo limita el perimetral).
server {
    listen 443 ssl;
    http2 on;
    server_name training.apolo.eafit.edu.co;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Terminal real: WebSocket al gateway. Upgrade y Connection no pasan solos
    # (son hop-by-hop) y el Upgrade necesita HTTP/1.1. Los timeouts de 2 h son
    # la sesión máxima del gateway: nginx no debe cortar antes que él.
    location = /ws/terminal {
        proxy_pass http://terminal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }

    # La API recibe la ruta completa, con /api (sin barra tras el upstream).
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás va al contenedor web, que sirve Angular y entrega
    # index.html para las rutas de la app.
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
