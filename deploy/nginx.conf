# No anunciar la versión de nginx (cabecera Server y páginas de error).
server_tokens off;

# Comprimir texto. Los videos (mp4) no van: ya vienen comprimidos.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/vtt;

resolver 127.0.0.11 valid=10s;


upstream web_upstream {
    zone web_upstream 64k;
    server web:8080 resolve;
}
upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream terminal_upstream {
    zone terminal_upstream 64k;
    server terminal:8001 resolve;
}

#Puerto 80: abierto a Internet solo para que Let's Encrypt valide el dominio.
server {
    listen 80;
    server_name training.apolo.eafit.edu.co;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Todo lo demás da 404; el 80 no expone la plataforma.
    location / {
        return 404;
    }
}

# Puerto 443: la plataforma, solo desde la VPN (lo limita el perimetral).
server {
    listen 443 ssl;
    http2 on;
    server_name training.apolo.eafit.edu.co;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cabeceras de seguridad. always: también en las respuestas de error.
    # Ojo: si una location usa add_header, deja de heredar TODAS estas.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Report-Only mientras Angular tenga su script en línea (ver W-05).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' wss://training.apolo.eafit.edu.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Terminal real: WebSocket al gateway. Upgrade y Connection no pasan solos
    # (son hop-by-hop) y el Upgrade necesita HTTP/1.1. Los timeouts de 2 h son
    # la sesión máxima del gateway: nginx no debe cortar antes que él.
    location = /ws/terminal {
        proxy_pass http://terminal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }

    # La API recibe la ruta completa, con /api (sin barra tras el upstream).
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás va al contenedor web, que sirve Angular y entrega
    # index.html para las rutas de la app.
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Videos: la API valida la sesión y responde X-Accel-Redirect; nginx manda
    # el archivo (con Range). internal: no se puede pedir desde fuera.
    location /media-interno/ {
        internal;
        alias /srv/apolo-training/media/;
    }

    # Subida de videos (PUT del panel): hasta 2 GB, pasando el cuerpo a la API
    # mientras llega. Sin barra final, para no redirigir GET /api/panel/videos.
    location /api/panel/videos {
        client_max_body_size 2G;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
