# ruff de apolo-training-admin (Python 3.9 de Rocky 9 en la VM de práctica).
# Una configuración anidada no hereda nada (en la raíz no hay ninguna), así que
# todo va aquí.
target-version = "py39"

[lint]
# Lista explícita para no depender de las reglas por defecto de cada versión
# de ruff (la 0.16 cambió muchas).
select = [
  "E",   # pycodestyle
  "W",
  "F",   # pyflakes
  "I",   # orden de imports
  "UP",  # sintaxis moderna de 3.9
  "B",   # bugbear
  "S",   # seguridad (bandit)
  "DTZ", # fechas con zona horaria (marcas de baja)
  "C4",  # comprensiones
  "SIM", # simplificaciones
  "PT",  # estilo de pytest
  "RUF",
]
ignore = [
  "E501", # el largo de línea lo maneja ruff format
  "S603", # el script existe para correr comandos del sistema, siempre con lista y sin shell
  "S607", # useradd, sacctmgr, etc. se buscan en el PATH de root (secure_path de sudo)
]

[lint.per-file-ignores]
"tests/**" = [
  "S101", # assert es la forma de probar en pytest
  "S105", # contraseñas de prueba
  "S106",
]

[lint.isort]
known-first-party = ["apolo_training_admin", "conftest"]
