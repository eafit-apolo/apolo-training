# Solo para probar la imagen de la web en local. La Q-02 lo reemplaza por
# deploy/compose.dev.yaml, con la API, la base y el nginx de borde.
name: apolo-training-web

services:
  web:
    build:
      context: .
      args:
        VERSION: dev
    image: apolo-training-web:dev
    ports:
      # Solo en tu máquina. Para otro puerto: WEB_PUERTO=8081 docker compose up -d
      - '127.0.0.1:${WEB_PUERTO:-8080}:8080'
