# Sirve la app compilada dentro del contenedor (usuario sin root, puerto 8080).
# TLS, cabeceras de seguridad y el reparto de /api van en el nginx de borde.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Detrás del nginx de borde, que las redirecciones no lleven :8080.
    absolute_redirect off;

    # Cambian con cada versión: el navegador siempre las revalida.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /i18n/ {
        add_header Cache-Control "no-cache";
    }

    # Llevan un hash en el nombre: se pueden guardar un año.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Las rutas de la app (/cursos, /mi-progreso…) las resuelve Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
