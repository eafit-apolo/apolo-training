<a class="saltar" href="#contenido">{{ 'shell.saltar' | transloco }}</a>

<mat-toolbar class="barra">
  <a class="marca" routerLink="/cursos">
    <img ngSrc="apolo-simbolo.png" width="32" height="32" alt="Apolo" priority />
    <span>{{ 'app.curso' | transloco }}</span>
  </a>

  @if (!sinMenu()) {
    <nav class="menu" [attr.aria-label]="'shell.menu' | transloco">
      @for (enlace of enlaces; track enlace.ruta) {
        <a
          mat-button
          [routerLink]="enlace.ruta"
          routerLinkActive="activo"
          ariaCurrentWhenActive="page"
        >
          {{ enlace.clave | transloco }}
        </a>
      }
    </nav>
  }

  <span class="espacio"></span>
  <at-selector-idioma />
</mat-toolbar>

<main id="contenido" class="contenido" tabindex="-1">
  <router-outlet />
</main>
